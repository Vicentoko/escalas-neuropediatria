<title>Escalas Neuropediatría</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header with tool chips, single centered column of instrument cards (max 760px) */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#16242B; --muted:#5B6B73; --line:#D6E0E3;
  --accent:#14485A; --accent-soft:#E1EDF0; --on-accent:#FFFFFF; --coral:#FF7A59;
  --ok:#1F6B3F; --ok-soft:#E6F4EC; --warn:#7A5A00; --warn-soft:#FBF1D2; --bad:#C53030; --bad-soft:#FDECEC;
  --display:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding-block:10px 4px;text-decoration:none}
.brand .k{display:block;font-size:.8rem;font-weight:600;color:var(--coral);line-height:1}
.brand .w{display:block;font-weight:800;font-size:1.3rem;color:var(--accent);letter-spacing:-.02em;line-height:1.1}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:8px 0 24px}
.hero .k{font-size:1.1rem;font-weight:600;color:var(--coral);margin-top:10px}
.hero .w{font-size:2.4rem;font-weight:800;color:var(--accent);letter-spacing:-.03em;line-height:1;margin-top:-2px}
.hero .t{font-size:.85rem;color:var(--muted);margin-top:6px}
nav{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
nav a{flex:none;font-size:.85rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
nav a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
main{padding-block:20px 40px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;margin:0 0 4px;text-wrap:balance;letter-spacing:-.015em}
h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item-h .sc{font-family:var(--mono);color:var(--accent);flex:none}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 10px}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:grid;grid-template-columns:2.2em 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:7px;border:1px solid transparent;cursor:pointer}
.opt:hover{background:var(--bg)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .n{font-family:var(--mono);text-align:center;border:1px solid var(--line);border-radius:6px;font-size:.85rem;padding-block:1px}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.opt:has(input:checked) .n{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sides>div{min-width:0}
.side-l{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.field .seg label{text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink)}
.seg span{display:inline-block;min-width:2.4em;text-align:center;font-variant-numeric:tabular-nums;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
.seg input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.result{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);margin-top:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
.result .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px}
.total{font-family:var(--mono);font-size:1.4rem}
.total small{font-size:.8rem;color:var(--muted)}
.pill{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.spacer{flex:1}
button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible,select:focus-visible,nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .field{flex:1 1 90px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grp{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:10px 0 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--display);font-weight:600;font-size:1.05rem}
.tile span{color:var(--muted);font-size:.88rem}
.ref{border-left:3px solid var(--line);padding-left:10px;color:var(--muted);font-size:.85rem}
.big{font-family:var(--mono);font-size:1.8rem;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono)}
.chart{overflow-x:auto} .chart svg{display:block;width:100%;height:auto;min-width:300px}
.chart text{fill:var(--muted);font-family:var(--body);font-size:13px}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t td:first-child{font-family:var(--mono);color:var(--accent);white-space:nowrap}
.yn{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.yn:last-child{border-bottom:0}
.yn .n{font-family:var(--mono);color:var(--muted)}
.yn.risk .n{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem}
.num{font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:.8rem;padding-block:24px}
@media (max-width:480px){.sides{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const $ = s => document.querySelector(s);

const fmt = (x, d=1) => x.toLocaleString("es", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtN = x => Number.isInteger(x) ? String(x) : fmt(x, 1);

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,1800); }
function copy(text){
  const done = () => toast("Resumen copiado");
  try { navigator.clipboard.writeText(text).then(done, () => fallback(text)); } catch(e){ fallback(text); }
}
function fallback(text){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove(); toast(ok ? "Resumen copiado" : "No se pudo copiar: " + text.slice(0,60) + "…");
}

// ---------- escalas genéricas (SARA, SPRS, Glasgow) ----------
function viewScale(id){
  const S = SCALES[id]; const st = ST[id] ||= {v:{}, age:"nino"};
  const optsOf = it => it.opts.map((o,i)=> Array.isArray(o) ? {s:o[0], t:(o.length===2||st.age==="nino"?o[1]:o[2]), n:(it.labels||S.labels)?.[i] ?? o[0]} : {s:i, t:o, n:i});
  if(S.defaultZero && !st.init){ S.items.forEach((it,k)=>{ st.v[k]=0; }); st.init=true; }
  const MAX = S.max ?? S.items.reduce((a,it)=>a+Math.max(...it.opts.map((o,i)=>Array.isArray(o)?o[0]:i)),0);
  const agesel = S.ages ? `<div class="row" style="margin-bottom:12px">
      <div class="seg" role="radiogroup" aria-label="Edad">
      <label><input type="radio" name="age" value="nino" ${st.age==="nino"?"checked":""}><span>Niño ≥2 años</span></label>
      <label><input type="radio" name="age" value="lact" ${st.age==="lact"?"checked":""}><span>Lactante / preverbal</span></label></div></div>` : "";
  const html = S.items.map((it,k)=>{
    const os = optsOf(it);
    if(it.bilateral){
      const seg = side => `<div><div class="side-l">${side==="d"?"Derecha":"Izquierda"}</div><div class="seg">${os.map(o=>
        `<label><input type="radio" name="i${k}${side}" value="${o.s}" ${st.v[k+side]===o.s?"checked":""}><span>${o.s}</span></label>`).join("")}</div></div>`;
      return `<div class="card"><div class="item-h"><h2>${k+1}. ${esc(it.name)}</h2><span class="sc" id="sc${k}"></span></div>
        ${it.hint?`<p class="hint">${esc(it.hint)}</p>`:""}
        <div class="sides">${seg("d")}${seg("i")}</div>
        <table class="t" style="margin-top:10px">${os.map(o=>`<tr><td>${o.s}</td><td>${esc(o.t)}</td></tr>`).join("")}</table></div>`;
    }
    return `${it.group?`<h2 class="grp">${esc(it.group)}</h2>`:""}<div class="card"><div class="item-h"><h2>${k+1}. ${esc(it.name)}</h2><span class="sc" id="sc${k}"></span></div>
      ${it.hint?`<p class="hint">${esc(it.hint)}</p>`:""}
      <div class="opts" role="radiogroup">${os.map(o=>`<label class="opt"><input type="radio" name="i${k}" value="${o.s}" ${st.v[k]===o.s?"checked":""}><span class="n">${o.n}</span><span>${esc(o.t)}</span></label>`).join("")}</div></div>`;
  }).join("");
  $("#view").innerHTML = `<h1>${S.title}</h1><p class="lede">${S.full}. ${S.lede}</p>${agesel}<div class="stack" id="items">${html}</div><p class="ref" style="margin-top:16px">${esc(S.ref)}</p>`;
  $("#view").onchange = e => {
    const n = e.target.name;
    if(n==="age"){ st.age=e.target.value; viewScale(id); return; }
    const m = n.match(/^i(\d+)([di]?)$/); if(!m) return;
    st.v[m[1]+m[2]] = Number(e.target.value); update();
  };
  function itemScore(k){
    const it=S.items[k];
    if(it.bilateral){ const d=st.v[k+"d"], i=st.v[k+"i"]; return (d==null||i==null)?null:(d+i)/2; }
    return st.v[k] ?? null;
  }
  function update(){
    let tot=0, n=0;
    S.items.forEach((it,k)=>{ const s=itemScore(k); $("#sc"+k).textContent = s==null?"":fmtN(s); if(s!=null){tot+=s;n++;} });
    const sc = S.items.map((it,k)=>itemScore(k));
    const all = n===S.items.length, I = all ? S.interpret(tot, sc) : null;
    bar(`${S.noTotal?"":`<span class="total num">${fmtN(tot)}<small> / ${MAX}</small></span>`}
      ${all?`<span class="pill ${I.cls}">${esc(I.txt)}</span>`:`<span class="pill">${n} de ${S.items.length} ítems</span>`}
      <span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ st.v={}; st.init=false; viewScale(id); };
    $("#cp").onclick=()=>{
      const parts = S.items.map((it,k)=>{ const s=itemScore(k); if(s==null) return `${it.name} –`;
        if(S.labels||it.labels){ const o=optsOf(it).find(o=>o.s===s); return `${it.name}: ${o.t}`; }
        return it.bilateral ? `${it.name} D${st.v[k+"d"]} I${st.v[k+"i"]} (${fmtN(s)})` : `${it.name} ${s}`; });
      const extra = S.ages ? ` [${st.age==="nino"?"niño":"lactante"}]` : "";
      const head = S.noTotal ? (all?I.txt:"incompleto") : `${fmtN(tot)}/${MAX}${all?"":" (incompleto)"}${all&&(I.cls||S.interpret.length>1)?` – ${I.txt}`:""}`;
      copy(`${S.title}${extra}: ${head}. ${S.defaultZero?parts.filter((p,k)=>sc[k]).join("; ")||"sin signos":parts.join("; ")}.`);
    };
  }
  update();
}

function pedmidasGrade(t){
  if(t<=10) return {g:"Grado I", txt:"Discapacidad nula o mínima", cls:"ok"};
  if(t<=30) return {g:"Grado II", txt:"Discapacidad leve", cls:"warn"};
  if(t<=50) return {g:"Grado III", txt:"Discapacidad moderada", cls:"bad"};
  return {g:"Grado IV", txt:"Discapacidad severa", cls:"bad"};
}

    bar(`<span class="total num">${tot}<small> días</small></span>
      ${n===6?`<span class="pill ${G.cls}">${G.g} · ${G.txt}</span>`:`<span class="pill">${n} de 6 respondidas</span>`}

      + (st.freq!==""?` Días con cefalea/3 m: ${st.freq}.`:"") + (st.sev!==""?` Intensidad: ${st.sev}/10.`:""));
  };
  $("#view").oninput = upd; $("#view").onchange=null; upd();
}

    let risk=0, n=0; const riskItems=[];
    for(let k=1;k<=20;k++){ const a=st.v[k]; const row=$("#yn"+k); if(a==null){row.classList.remove("risk");continue;} n++;
      const r = MCHAT_YES_RISK.includes(k) ? a===1 : a===0; row.classList.toggle("risk", r); if(r){risk++; riskItems.push(k);} }
    const I = risk<=2 ? {cls:"ok",txt:"Riesgo bajo"} : risk<=7 ? {cls:"warn",txt:"Riesgo medio: aplicar entrevista de seguimiento"} : {cls:"bad",txt:"Riesgo alto: derivar a evaluación diagnóstica"};
    bar(`<span class="total num">${risk}<small> / 20</small></span>
      ${n===20?`<span class="pill ${I.cls}">${I.txt}</span>`:`<span class="pill">${n} de 20 ítems</span>`}
      <span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ delete ST.mchat; viewMchat(); };
    $("#cp").onclick=()=>copy(`M-CHAT-R: ${risk}/20 – ${I.txt}${n<20?" (incompleto)":""}. Ítems de riesgo: ${riskItems.join(", ")||"ninguno"}.`);
  };
  $("#view").onchange = e => { const m=e.target.name.match(/^m(\d+)$/); if(m){ st.v[m[1]]=Number(e.target.value); upd(); } };
  $("#view").oninput=null; upd();
}

const TARDIEU_MUSCLES = ["Gastrocnemio (rodilla extendida)","Sóleo (rodilla flexionada)","Isquiotibiales","Aductores de cadera","Recto femoral","Flexores de codo","Pronadores","Flexores de muñeca","Flexores de dedos"];

function viewTardieu(){
  const st = ST.tardieu ||= {rows:[{m:0,side:"d",r1:"",r2:"",x:null},{m:0,side:"i",r1:"",r2:"",x:null}]};

    <div class="row" style="margin-top:10px;align-items:end">
      <div class="field"><label>Lado</label><div class="seg"><label><input type="radio" name="side${k}" value="d" ${r.side==="d"?"checked":""}><span>Der</span></label><label><input type="radio" name="side${k}" value="i" ${r.side==="i"?"checked":""}><span>Izq</span></label></div></div>
      <div class="field"><label for="r1${k}">R1 (V3) °</label><input id="r1${k}" name="r1" type="number" inputmode="numeric" value="${r.r1}"></div>
      <div class="field"><label for="r2${k}">R2 (V1) °</label><input id="r2${k}" name="r2" type="number" inputmode="numeric" value="${r.r2}"></div>
      <div class="field"><label>R2 − R1</label><div class="big num" style="font-size:1.3rem" id="dif${k}">–</div></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Calidad de la reacción (X)</label><div class="seg">${[0,1,2,3,4,5].map(x=>`<label><input type="radio" name="x${k}" value="${x}" ${r.x===x?"checked":""}><span>${x}</span></label>`).join("")}</div></div>
    ${st.rows.length>1?`<div style="margin-top:10px"><button data-del="${k}">Quitar</button></div>`:""}
  </div>`;
  $("#view").innerHTML = `<h1>Tardieu modificada</h1>
  <p class="lede">Para cada músculo: R2 es el ángulo de rango pasivo a velocidad lenta (V1) y R1 el ángulo del enganche a velocidad rápida (V3). Una diferencia R2 − R1 amplia sugiere componente dinámico (espasticidad); una diferencia pequeña sugiere contractura fija.</p>
  <div class="stack" id="rows">${st.rows.map(rowHtml).join("")}</div>
  <div style="margin-top:12px"><button id="add">Agregar músculo</button></div>
  <div class="card" style="margin-top:16px"><h2>Calidad de la reacción muscular (X)</h2><table class="t" style="margin-top:8px">${TARDIEU_X.map((t,i)=>`<tr><td>${i}</td><td>${t}</td></tr>`).join("")}</table>
  <p class="hint" style="margin-top:8px">V1: lo más lento posible. V2: velocidad de caída por gravedad. V3: lo más rápido posible. Ángulos medidos desde la posición de mínimo estiramiento.</p></div>
  <p class="ref" style="margin-top:16px">Tardieu G, et al. 1954; Boyd RN, Graham HK. Eur J Neurol 1999;6(Suppl 4):S23–35.</p>`;
  const num = v => v===""||v==null ? null : Number(v);
  const upd = () => {
    const lines=[];
    st.rows.forEach((r,k)=>{ const a=num(r.r1), b=num(r.r2); const d = a!=null&&b!=null ? b-a : null;

    if(!lines.length){ bar(null); return; }
    bar(`<span class="pill">${lines.length} músculo${lines.length>1?"s":""} evaluado${lines.length>1?"s":""}</span><span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ delete ST.tardieu; viewTardieu(); };

  };
  $("#view").oninput = $("#view").onchange = e => {
    const c=e.target.closest("[data-k]"); if(!c) return; const r=st.rows[+c.dataset.k], n=e.target.name;
    if(n==="m") r.m=+e.target.value; else if(n==="r1"||n==="r2") r[n]=e.target.value;
    else if(n.startsWith("side")) r.side=e.target.value; else if(n.startsWith("x")) r.x=+e.target.value;
    upd();
  };
  $("#add").onclick=()=>{ const last=st.rows[st.rows.length-1]; st.rows.push({m:last?last.m:0, side:last&&last.side==="d"?"i":"d", r1:"",r2:"",x:null}); viewTardieu(); };
  $("#rows").onclick=e=>{ const d=e.target.dataset.del; if(d!=null){ st.rows.splice(+d,1); viewTardieu(); } };
  upd();
}

// ---------- Burke-Fahn-Marsden ----------
const BFM_PROV = ["Sin distonía","Solo con una acción específica","Con muchas acciones","Con la acción de una parte distante del cuerpo, o intermitente en reposo","Presente en reposo"];
const BFM_PROV_SPEECH = ["Ninguno","Ocasional en habla o deglución, o en ambas","Frecuente en una de ellas","Frecuente en una y ocasional en la otra","Frecuente en ambas"];
const BFM_REG = [
  ["Ojos",0.5,["Sin distonía","Leve: parpadeo ocasional","Parpadeo frecuente sin espasmos prolongados","Espasmos prolongados de cierre palpebral, ojos abiertos la mayor parte del tiempo","Espasmos prolongados, ojos cerrados al menos 30% del tiempo"]],
  ["Boca",0.5,["Sin distonía","Leve: muecas ocasionales u otros movimientos","Muecas u otros movimientos menos del 50% del tiempo","Espasmos o contracciones distónicas moderadas la mayor parte del tiempo","Contracciones severas la mayor parte del tiempo"]],
  ["Habla y deglución",1,["Normal","Leve: se entiende fácil o atoros ocasionales","Cierta dificultad para entender o atoros frecuentes","Marcada dificultad para entender o no puede tragar sólidos","Anartria total o casi total, o gran dificultad para tragar blandos y líquidos"],true],
  ["Cuello",0.5,["Sin distonía","Leve: tracción ocasional","Tortícolis evidente pero leve","Tracción moderada","Tracción extrema"]],
  ["Brazo derecho",1,["Sin distonía","Leve, sin importancia clínica","Evidente pero no discapacitante","Moderada: puede tomar objetos con algo de función manual","Severa: sin prensión útil"]],
  ["Brazo izquierdo",1,null],
  ["Tronco",1,["Sin distonía","Leve inclinación, sin importancia clínica","Inclinación evidente que no interfiere con estar de pie o caminar","Moderada: interfiere con estar de pie o caminar","Extrema: impide estar de pie o caminar"]],
  ["Pierna derecha",1,["Sin distonía","Leve, sin alteración funcional","Leve: camina con agilidad y sin ayuda","Moderada: dificulta mucho la marcha o requiere ayuda","Severa: no puede pararse ni caminar sobre esa pierna"]],
  ["Pierna izquierda",1,null]
];
BFM_REG[5][2]=BFM_REG[4][2]; BFM_REG[8][2]=BFM_REG[7][2];
const BFM_DIS = [["Habla",4],["Escritura",4],["Alimentación (uso de cubiertos)",4],["Comer y deglutir",4],["Higiene",4],["Vestirse",4],["Marcha",6]];
function viewBfm(){
  const st = ST.bfm ||= {p:{}, s:{}, d:{}};
  const seg = (nm,val,max) => `<div class="seg">${Array.from({length:max+1},(_,i)=>`<label><input type="radio" name="${nm}" value="${i}" ${val===i?"checked":""}><span>${i}</span></label>`).join("")}</div>`;
  $("#view").innerHTML = `<h1>Burke-Fahn-Marsden</h1>
  <p class="lede">Escala de distonía (BFMDRS). Movimiento: en cada región, factor provocador × severidad × peso; total 0–120. Discapacidad: 0–30.</p>
  <div class="stack">${BFM_REG.map(([n,w,sev,speech],k)=>`<div class="card"><div class="item-h"><h2>${n} <small style="color:var(--muted);font-weight:400">× ${fmtN(w)}</small></h2><span class="sc" id="bs${k}"></span></div>
    <div class="sides" style="margin-top:8px"><div><div class="side-l">Factor provocador</div>${seg("p"+k,st.p[k],4)}</div><div><div class="side-l">Severidad</div>${seg("s"+k,st.s[k],4)}</div></div>
    <details style="margin-top:8px"><summary class="hint" style="cursor:pointer">Ver descriptores</summary><div class="sides" style="margin-top:6px">
      <table class="t">${(speech?BFM_PROV_SPEECH:BFM_PROV).map((t,i)=>`<tr><td>${i}</td><td>${t}</td></tr>`).join("")}</table>
      <table class="t">${sev.map((t,i)=>`<tr><td>${i}</td><td>${t}</td></tr>`).join("")}</table></div></details></div>`).join("")}
  <div class="card"><h2>Escala de discapacidad</h2><p class="hint">0 normal a 4 dependencia total (marcha: 0 normal a 6 no camina).</p>
    <div class="stack">${BFM_DIS.map(([n,mx],k)=>`<div><div class="side-l">${n}</div>${seg("d"+k,st.d[k],mx)}</div>`).join("")}</div></div></div>
  <p class="ref" style="margin-top:16px">Burke RE, Fahn S, Marsden CD, et al. Neurology 1985;35:73–7. Descriptores resumidos.</p>`;
  const upd = () => {
    let mov=0, n=0; const parts=[];
    BFM_REG.forEach(([nm,w],k)=>{ const p=st.p[k], s=st.s[k]; const v = p!=null&&s!=null ? p*s*w : null;
      $("#bs"+k).textContent = v==null?"":fmtN(v); if(v!=null){ mov+=v; n++; if(v>0) parts.push(`${nm} ${p}×${s}${w!==1?"×0,5":""}=${fmtN(v)}`); } });
    const dn = Object.keys(st.d).length, dis = Object.values(st.d).reduce((a,b)=>a+b,0);
    bar(`<span class="total num">${fmtN(mov)}<small> / 120</small></span>${n<9?`<span class="pill">${n} de 9 regiones</span>`:""}
      ${dn?`<span class="pill">Discapacidad ${dis}/30</span>`:""}<span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ delete ST.bfm; viewBfm(); };
    $("#cp").onclick=()=>copy(`BFMDRS movimiento: ${fmtN(mov)}/120${n<9?" (incompleto)":""}${parts.length?` (${parts.join("; ")})`:""}.${dn?` Discapacidad: ${dis}/30${dn<7?" (incompleto)":""}.`:""}`);
  };
  $("#view").onchange = e => { const m=e.target.name.match(/^([psd])(\d+)$/); if(m){ st[m[1]][m[2]]=+e.target.value; upd(); } };
  upd();
}

// ---------- perímetro craneano ----------
// HC.who_m/f: M y S diarios 0–1856 días (L=1). HC.cdc_m/f: [mes, L, M, S] 0–36 meses.
const DPM = 30.4375;
function whoLMS(sex, days){
  const t = HC["who_"+sex]; if(days<0 || days>t.M.length-1) return null;
  const i=Math.floor(days), f=days-i, j=Math.min(i+1,t.M.length-1);
  return {L:1, M:t.M[i]+(t.M[j]-t.M[i])*f, S:t.S[i]+(t.S[j]-t.S[i])*f};
}
function cdcLMS(sex, months){
  const t = HC["cdc_"+sex]; if(months<0 || months>36) return null;
  let k=0; while(k<t.length-2 && t[k+1][0]<months) k++;
  const a=t[k], b=t[k+1], f=(months-a[0])/(b[0]-a[0]);
  return {L:a[1]+(b[1]-a[1])*f, M:a[2]+(b[2]-a[2])*f, S:a[3]+(b[3]-a[3])*f};
}
const zOf = (x,{L,M,S}) => Math.abs(L)<1e-9 ? Math.log(x/M)/S : (Math.pow(x/M,L)-1)/(L*S);
const xOf = (z,{L,M,S}) => Math.abs(L)<1e-9 ? M*Math.exp(S*z) : M*Math.pow(1+L*S*z,1/L);
function ncdf(z){ // Abramowitz-Stegun 7.1.26
  const t=1/(1+0.3275911*Math.abs(z)/Math.SQRT2);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z/2);
  return z>=0 ? (1+y)/2 : (1-y)/2;
}
const pctTxt = p => p<0.001 ? "<0,1" : p>0.999 ? ">99,9" : fmt(p*100, p<0.01||p>0.99 ? 1 : 0);
function hcInterp(z){
  if(z<-3) return {cls:"bad", txt:"Microcefalia severa (< −3 DE)"};
  if(z<-2) return {cls:"bad", txt:"Microcefalia (< −2 DE)"};
  if(z>3) return {cls:"bad", txt:"Macrocefalia (> +3 DE)"};
  if(z>2) return {cls:"bad", txt:"Macrocefalia (> +2 DE)"};
  if(Math.abs(z)>1.88) return {cls:"warn", txt: z<0 ? "Bajo P3" : "Sobre P97"};
  return {cls:"ok", txt:"Rango normal"};
}
const iso = d => d.toISOString().slice(0,10);
function daysBetween(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/864e5); }
function ageTxt(days){
  if(days<DPM*24){ const m=Math.floor(days/DPM), d=Math.round(days-m*DPM); return `${m} m ${d} d`; }
  const y=Math.floor(days/365.25), m=Math.floor((days-y*365.25)/DPM); return `${y} a ${m} m`;
}

function viewPC(){
  const st = ST.pc ||= {sex:"m", mode:"fechas", dob:"", dom:iso(new Date()), y:"", mo:"", d:"", ga:"", gad:"", corr:true, hc:"", ref:"who"};
  $("#view").innerHTML = `<h1>Perímetro craneano</h1>
  <p class="lede">Puntaje z y percentil con las tablas LMS oficiales: OMS 2006 (0–5 años, por día) y CDC 2000 (0–36 meses).</p>
  <div class="stack">
  <div class="card"><div class="grid2">
    <div class="field"><label>Sexo</label><div class="seg">
      <label><input type="radio" name="sex" value="m" ${st.sex==="m"?"checked":""}><span>Masculino</span></label>
      <label><input type="radio" name="sex" value="f" ${st.sex==="f"?"checked":""}><span>Femenino</span></label></div></div>
    <div class="field"><label for="hc">Perímetro craneano (cm)</label><input id="hc" type="number" inputmode="decimal" step="0.1" min="20" max="65" placeholder="ej. 44,5" value="${st.hc}"></div>
  </div></div>
  <div class="card"><div class="field" style="margin-bottom:10px"><label>Edad</label><div class="seg">
      <label><input type="radio" name="mode" value="fechas" ${st.mode==="fechas"?"checked":""}><span>Por fechas</span></label>
      <label><input type="radio" name="mode" value="edad" ${st.mode==="edad"?"checked":""}><span>Edad directa</span></label></div></div>
    <div class="grid2" ${st.mode==="fechas"?"":"hidden"} id="byDates">
      <div class="field"><label for="dob">Fecha de nacimiento</label><input id="dob" type="date" value="${st.dob}"></div>
      <div class="field"><label for="dom">Fecha de medición</label><input id="dom" type="date" value="${st.dom}"></div></div>
    <div class="row" ${st.mode==="edad"?"":"hidden"} id="byAge">
      <div class="field"><label for="ay">Años</label><input id="ay" type="number" inputmode="numeric" min="0" max="5" value="${st.y}"></div>
      <div class="field"><label for="am">Meses</label><input id="am" type="number" inputmode="numeric" min="0" max="60" value="${st.mo}"></div>
      <div class="field"><label for="ad">Días</label><input id="ad" type="number" inputmode="numeric" min="0" max="31" value="${st.d}"></div></div>
    <div class="row" style="margin-top:12px;align-items:end">
      <div class="field"><label for="ga">EG al nacer (sem)</label><input id="ga" type="number" inputmode="numeric" min="22" max="42" placeholder="término" value="${st.ga}"></div>
      <div class="field"><label for="gad">+ días</label><input id="gad" type="number" inputmode="numeric" min="0" max="6" value="${st.gad}"></div>
      <label class="field" style="flex:2 1 200px;flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink)">
        <input type="checkbox" id="corr" style="width:auto" ${st.corr?"checked":""}> Usar edad corregida si &lt;37 sem (hasta 24 meses)</label>
    </div>
  </div>
  <div id="out"></div>
  <div class="card"><div class="item-h"><h2>Curva</h2><div class="seg">
      <label><input type="radio" name="ref" value="who" ${st.ref==="who"?"checked":""}><span>OMS</span></label>
      <label><input type="radio" name="ref" value="cdc" ${st.ref==="cdc"?"checked":""}><span>CDC</span></label></div></div>
    <div class="chart" id="chart" style="margin-top:8px"></div></div>
  </div>
  <p class="ref" style="margin-top:16px">OMS: WHO Child Growth Standards 2006 (head circumference-for-age). CDC: CDC 2000 Growth Charts (hcageinf). Datos LMS tomados del paquete rcpchgrowth (RCPCH), que reproduce las tablas oficiales. La OMS se recomienda para 0–2 años; CDC hasta 36 meses.</p>`;

  const read = () => {
    st.hc=$("#hc").value; st.dob=$("#dob").value; st.dom=$("#dom").value; st.y=$("#ay").value; st.mo=$("#am").value; st.d=$("#ad").value;
    st.ga=$("#ga").value; st.gad=$("#gad").value; st.corr=$("#corr").checked;
  };
  const calc = () => {
    read();
    let days=null;
    if(st.mode==="fechas"){ if(st.dob && st.dom) days=daysBetween(st.dob, st.dom); }
    else if(st.y!==""||st.mo!==""||st.d!=="") days=(+st.y||0)*365.25+(+st.mo||0)*DPM+(+st.d||0);
    let corrDays=0, corrected=false;
    const ga = st.ga===""?null:(+st.ga)*7+(+st.gad||0);
    if(days!=null && ga!=null && ga<37*7 && st.corr && days<DPM*24){ corrDays=280-ga; corrected=true; }
    const hc = st.hc===""?null:Number(String(st.hc).replace(",","."));
    const out=$("#out");
    if(days==null || days<0){ out.innerHTML = days<0?`<div class="card"><span class="pill bad">La fecha de medición es anterior al nacimiento</span></div>`:""; bar(null); drawChart(null,null); return; }
    const ad = days - corrDays;
    const ageLine = corrected ? `Edad cronológica ${ageTxt(days)} · <b>corregida ${ad<0?"−"+ageTxt(-ad):ageTxt(ad)}</b>` : `Edad ${ageTxt(days)}`;
    if(ad<0){ out.innerHTML=`<div class="card">${ageLine}<p class="hint">Con edad corregida negativa (antes del término) use curvas de prematuros (Fenton / INTERGROWTH-21st).</p></div>`; bar(null); drawChart(null,null); return; }
    const res = [];
    const w = whoLMS(st.sex, ad), c = cdcLMS(st.sex, ad/DPM);
    for(const [nm,lms] of [["OMS",w],["CDC",c]]){
      if(!lms){ res.push({nm, na:true}); continue; }
      const z = hc==null?null:zOf(hc,lms);
      res.push({nm, lms, z, p:z==null?null:ncdf(z)});
    }
    out.innerHTML = `<div class="card"><p style="margin:0 0 10px">${ageLine}</p><div class="grid2">${res.map(r=>`<div>
      <div class="side-l">${r.nm}</div>
      ${r.na?`<p class="hint">Fuera de rango (${r.nm==="OMS"?"0–5 años":"0–36 meses"})</p>`:
      r.z==null?`<dl class="kv"><dt>P50</dt><dd>${fmt(r.lms.M,1)} cm</dd><dt>−2 DE</dt><dd>${fmt(xOf(-2,r.lms),1)} cm</dd><dt>+2 DE</dt><dd>${fmt(xOf(2,r.lms),1)} cm</dd></dl>`:
      `<div class="big num">z ${r.z<0?"−":"+"}${fmt(Math.abs(r.z),2)}</div><div class="num" style="margin:2px 0 8px">Percentil ${pctTxt(r.p)}</div>
       <span class="pill ${hcInterp(r.z).cls}">${hcInterp(r.z).txt}</span>
       <dl class="kv" style="margin-top:10px"><dt>P50</dt><dd>${fmt(r.lms.M,1)} cm</dd><dt>−2 / +2 DE</dt><dd>${fmt(xOf(-2,r.lms),1)} / ${fmt(xOf(2,r.lms),1)} cm</dd></dl>`}
    </div>`).join("")}</div></div>`;
    drawChart(ad, hc);
    if(hc!=null){
      const sum = `PC ${fmt(hc,1)} cm, ${st.sex==="m"?"masculino":"femenino"}, ${corrected?`edad corregida ${ageTxt(ad)} (cronológica ${ageTxt(days)})`:`edad ${ageTxt(days)}`}. `
        + res.filter(r=>!r.na).map(r=>`${r.nm}: z ${r.z<0?"−":"+"}${fmt(Math.abs(r.z),2)}, P${pctTxt(r.p)} (${hcInterp(r.z).txt.toLowerCase()})`).join("; ") + ".";
      bar(`<span class="pill">${res.filter(r=>!r.na).map(r=>`${r.nm} z ${r.z<0?"−":"+"}${fmt(Math.abs(r.z),2)}`).join(" · ")}</span><span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
      $("#cp").onclick=()=>copy(sum); $("#clr").onclick=()=>{ delete ST.pc; viewPC(); };
    } else bar(null);
  };
  function drawChart(ad, hc){
    const sex=st.sex, ref=st.ref, maxM = ref==="who" ? 60 : 36;
    const W=480,H=360,pl=34,pr=34,pt=12,pb=30;
    const lines = ref==="who" ? [[-3,"−3"],[-2,"−2"],[0,"0"],[2,"+2"],[3,"+3"]] : [[-1.8808,"P3"],[-1.2816,"P10"],[0,"P50"],[1.2816,"P90"],[1.8808,"P97"]];
    const get = m => ref==="who" ? whoLMS(sex, Math.min(m*DPM, 1856)) : cdcLMS(sex, m);
    const pts = []; for(let m=0;m<=maxM+1e-9;m+=0.25) pts.push(m);
    const ymin = Math.floor(xOf(-3.2,get(0))) , ymax = Math.ceil(xOf(3.2,get(maxM)));
    const X = m => pl+(W-pl-pr)*m/maxM, Y = v => pt+(H-pt-pb)*(1-(v-ymin)/(ymax-ymin));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de perímetro craneano ${ref==="who"?"OMS":"CDC"}">`;
    for(let v=Math.ceil(ymin/2)*2; v<=ymax; v+=2) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
    const step = ref==="who"?6:3;
    for(let m=0;m<=maxM;m+=step) s+=`<line x1="${X(m)}" x2="${X(m)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-width="1" opacity=".6"/><text x="${X(m)}" y="${H-pb+16}" text-anchor="middle">${m}</text>`;
    s+=`<text x="${W-pr}" y="${H-4}" text-anchor="end">meses</text><text x="4" y="${pt+8}">cm</text>`;
    for(const [z,lab] of lines){
      const d = pts.map((m,i)=>`${i?"L":"M"}${X(m).toFixed(1)},${Y(xOf(z,get(m))).toFixed(1)}`).join("");
      const strong = z===0, ext = Math.abs(z)>=1.88;
      s+=`<path d="${d}" fill="none" stroke="${strong?"var(--accent)":ext?"var(--bad)":"var(--muted)"}" stroke-width="${strong?2:1.4}" ${Math.abs(z)>2.5?'stroke-dasharray="4 3"':""}/>`;
      s+=`<text x="${W-pr+4}" y="${Y(xOf(z,get(maxM)))+4}">${lab}</text>`;
    }
    if(ad!=null && hc!=null && ad/DPM<=maxM) s+=`<circle cx="${X(ad/DPM)}" cy="${Y(hc)}" r="5.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
    $("#chart").innerHTML = s+"</svg>";
  }
  $("#view").oninput = calc;
  $("#view").onchange = e => {
    const n=e.target.name;
    if(n==="sex"||n==="ref"){ st[n]=e.target.value; calc(); }
    else if(n==="mode"){ read(); st.mode=e.target.value; viewPC(); }
    else calc();
  };
  calc();
}

route();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
