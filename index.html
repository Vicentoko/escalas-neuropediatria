<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14485A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escalas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Escalas Neuropediatría</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header with tool chips, single centered column of instrument cards (max 760px) */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#16242B; --muted:#5B6B73; --line:#D6E0E3;
  --accent:#14485A; --accent-soft:#E1EDF0; --on-accent:#FFFFFF; --coral:#FF7A59;
  --ok:#1F6B3F; --ok-soft:#E6F4EC; --warn:#7A5A00; --warn-soft:#FBF1D2; --bad:#C53030; --bad-soft:#FDECEC;
  --display:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:var(--body);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:var(--accent)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-variant-numeric:tabular-nums;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding-block:10px 4px;text-decoration:none}
.brand .k{display:block;font-size:.8rem;font-weight:600;color:var(--coral);line-height:1}
.brand .w{display:block;font-weight:800;font-size:1.3rem;color:var(--accent);letter-spacing:-.02em;line-height:1.1}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:8px 0 24px}
.hero .k{font-size:1.1rem;font-weight:600;color:var(--coral);margin-top:10px}
.hero .w{font-size:clamp(1.8rem,8vw,2.4rem);font-weight:800;color:var(--accent);letter-spacing:-.03em;line-height:1.05;margin-top:12px;text-wrap:balance}
.hero .t{font-size:.85rem;color:var(--muted);margin-top:6px}
nav{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
nav a{flex:none;font-size:.85rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
nav a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
main{padding-block:20px 40px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;margin:0 0 4px;text-wrap:balance;letter-spacing:-.015em}
h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item-h .sc{font-family:var(--mono);color:var(--accent);flex:none}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 10px}
.opts{display:flex;flex-direction:column;gap:4px}
.opt{display:grid;grid-template-columns:2.2em 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:7px;border:1px solid transparent;cursor:pointer}
.opt:hover{background:var(--bg)}
.opt{position:relative}
.opt input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.opt .n{font-family:var(--mono);text-align:center;border:1px solid var(--line);border-radius:6px;font-size:.85rem;padding-block:1px}
.opt input[type=checkbox]:not(:checked) ~ .n{color:transparent}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.opt:has(input:checked) .n{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sides>div{min-width:0}
.side-l{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg label{cursor:pointer}
.seg label{position:relative}
.seg input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.field .seg label{text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink)}
.seg span{display:inline-block;min-width:2.4em;text-align:center;font-variant-numeric:tabular-nums;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
.seg input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.result{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);margin-top:18px;padding-bottom:env(safe-area-inset-bottom,0px)}
.result .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px}
.total{font-family:var(--mono);font-size:1.4rem;font-weight:700}
.total small{font-size:.8rem;color:var(--muted)}
.pill{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.spacer{flex:1}
button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible,select:focus-visible,nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .field{flex:1 1 90px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.search{position:relative;margin-bottom:16px}
.search input{font:inherit;font-size:1rem;width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
details.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.cat>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:1.05rem;color:var(--accent)}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary .c{margin-left:auto;font-weight:400;font-size:.85rem;color:var(--muted)}
details.cat>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 6px;transition:transform .15s}
details.cat[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.cat>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
details.cat .tiles{padding:0 12px 12px}
details.cat .tile{background:var(--bg);border-color:transparent}
details.cat .tile:hover{border-color:var(--accent)}
.empty{color:var(--muted);padding:12px 4px}
.grp{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:10px 0 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--display);font-weight:600;font-size:1.05rem}
.tile span{color:var(--muted);font-size:.88rem}
.ref{border-left:3px solid var(--line);padding-left:10px;color:var(--muted);font-size:.85rem}
.big{font-family:var(--mono);font-size:1.8rem;font-weight:700;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono)}
.pic-row{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:center;margin-top:6px}
.pic{width:160px;height:auto;background:var(--accent-soft);border-radius:8px}
@media (max-width:420px){.pic-row{grid-template-columns:1fr}.pic{width:100%;max-width:260px}}
.chart{overflow-x:auto} .chart svg{display:block;width:100%;height:auto;min-width:300px}
.chart text{fill:var(--muted);font-family:var(--body);font-size:13px}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t td:first-child{font-family:var(--mono);color:var(--accent);white-space:nowrap}
.yn{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.yn:last-child{border-bottom:0}
.yn .n{font-family:var(--mono);color:var(--muted)}
.yn.risk .n{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem}
.num{font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:.8rem;padding-block:24px}
@media (max-width:480px){.sides{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

// ---------- escalas genéricas (SARA, SPRS, Glasgow) ----------
function viewScale(id){
  const S = SCALES[id]; const st = ST[id] ||= {v:{}, age:"nino"};
  const optsOf = it => it.opts.map((o,i)=> Array.isArray(o) ? {s:o[0], t:(o.length===2||st.age==="nino"?o[1]:o[2]), n:(it.labels||S.labels)?.[i] ?? o[0]} : {s:i, t:o, n:i});
  if(S.defaultZero && !st.init){ S.items.forEach((it,k)=>{ st.v[k]=0; }); st.init=true; }
  const MAX = S.max ?? S.items.reduce((a,it)=>a+Math.max(...it.opts.map((o,i)=>Array.isArray(o)?o[0]:i)),0);
  const agesel = S.ages ? `<div class="row" style="margin-bottom:12px">
      <div class="seg" role="radiogroup" aria-label="Edad">
      <label><input type="radio" name="age" value="nino" ${st.age==="nino"?"checked":""}><span>Niño ≥2 años</span></label>
      <label><input type="radio" name="age" value="lact" ${st.age==="lact"?"checked":""}><span>Lactante / preverbal</span></label></div></div>` : "";
  const html = S.items.map((it,k)=>{
    const os = optsOf(it);
    if(it.bilateral){
      const seg = side => `<div><div class="side-l">${side==="d"?"Derecha":"Izquierda"}</div><div class="seg">${os.map(o=>
        `<label><input type="radio" name="i${k}${side}" value="${o.s}" ${st.v[k+side]===o.s?"checked":""}><span>${o.s}</span></label>`).join("")}</div></div>`;
      return `<div class="card"><div class="item-h"><h2>${k+1}. ${esc(it.name)}</h2><span class="sc" id="sc${k}"></span></div>
        ${it.hint?`<p class="hint">${esc(it.hint)}</p>`:""}
        <div class="sides">${seg("d")}${seg("i")}</div>
        <table class="t" style="margin-top:10px">${os.map(o=>`<tr><td>${o.s}</td><td>${esc(o.t)}</td></tr>`).join("")}</table></div>`;
    }
    return `${it.group?`<h2 class="grp">${esc(it.group)}</h2>`:""}<div class="card"><div class="item-h"><h2>${k+1}. ${esc(it.name)}</h2><span class="sc" id="sc${k}"></span></div>
      ${it.hint?`<p class="hint">${esc(it.hint)}</p>`:""}
      <div class="opts" role="radiogroup">${os.map(o=>`<label class="opt"><input type="radio" name="i${k}" value="${o.s}" ${st.v[k]===o.s?"checked":""}><span class="n">${o.n}</span><span>${esc(o.t)}</span></label>`).join("")}</div></div>`;
  }).join("");
  $("#view").innerHTML = `<h1>${S.title}</h1><p class="lede">${S.full}. ${S.lede}</p>${agesel}<div class="stack" id="items">${html}${S.after?S.after():""}</div><p class="ref" style="margin-top:16px">${esc(S.ref)}</p>`;
  $("#view").onchange = e => {
    const n = e.target.name;
    if(n==="age"){ st.age=e.target.value; viewScale(id); return; }
    const m = n.match(/^i(\d+)([di]?)$/); if(!m) return;
    st.v[m[1]+m[2]] = Number(e.target.value); update();
  };
  S.wire?.();
  function itemScore(k){
    const it=S.items[k];
    if(it.bilateral){ const d=st.v[k+"d"], i=st.v[k+"i"]; return (d==null||i==null)?null:(d+i)/2; }
    return st.v[k] ?? null;
  }
  function update(){
    let tot=0, n=0;
    S.items.forEach((it,k)=>{ const s=itemScore(k); $("#sc"+k).textContent = s==null?"":fmtN(s); if(s!=null){tot+=s;n++;} });
    const sc = S.items.map((it,k)=>itemScore(k));
    const all = n===S.items.length, I = all ? S.interpret(tot, sc) : null;
    bar(`${S.noTotal?"":`<span class="total num">${fmtN(tot)}<small> / ${MAX}</small></span>`}
      ${all?`<span class="pill ${I.cls}">${esc(I.txt)}</span>`:`<span class="pill">${n} de ${S.items.length} ítems</span>`}
      <span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ st.v={}; st.init=false; viewScale(id); };
    $("#cp").onclick=()=>{
      const parts = S.items.map((it,k)=>{ const s=itemScore(k); if(s==null) return `${it.name} –`;
        if(S.labels||it.labels){ const o=optsOf(it).find(o=>o.s===s); return `${it.name}: ${o.t}`; }
        return it.bilateral ? `${it.name} D${st.v[k+"d"]} I${st.v[k+"i"]} (${fmtN(s)})` : `${it.name} ${s}`; });
      const extra = S.ages ? ` [${st.age==="nino"?"niño":"lactante"}]` : "";
      const head = S.noTotal ? (all?I.txt:"incompleto") : `${fmtN(tot)}/${MAX}${all?"":" (incompleto)"}${all&&(I.cls||S.interpret.length>1)?` – ${I.txt}`:""}`;
      copy(`${S.title}${extra}: ${head}. ${S.defaultZero?parts.filter((p,k)=>sc[k]).join("; ")||"sin signos":parts.join("; ")}.`);
    };
  }
  update();
}

// ---------- PedMIDAS ----------
function pedmidasGrade(t){
  if(t<=10) return {g:"Grado I", txt:"Discapacidad nula o mínima", cls:"ok"};
  if(t<=30) return {g:"Grado II", txt:"Discapacidad leve", cls:"warn"};
  if(t<=50) return {g:"Grado III", txt:"Discapacidad moderada", cls:"bad"};
  return {g:"Grado IV", txt:"Discapacidad severa", cls:"bad"};
}

      + (st.freq!==""?` Días con cefalea/3 m: ${st.freq}.`:"") + (st.sev!==""?` Intensidad: ${st.sev}/10.`:""));

const ROMAN = ["I","II","III","IV","V"];

function viewGmfcs(){
  const st = ST.gmfcs ||= {band:"6-12", lvl:null};
  $("#view").innerHTML = `<h1>GMFCS E&amp;R</h1>
  <p class="lede">Sistema de Clasificación de la Función Motora Gruesa, ampliado y revisado. Elija la franja de edad y el nivel que mejor describe el desempeño habitual del niño (no su máxima capacidad). En prematuros menores de 2 años use la edad corregida.</p>
  <div class="seg" style="margin-bottom:14px" role="radiogroup" aria-label="Edad">${GMFCS_BANDS.map(([k,l])=>
    `<label><input type="radio" name="band" value="${k}" ${st.band===k?"checked":""}><span>${l}</span></label>`).join("")}</div>
  <div class="opts card" role="radiogroup">${GMFCS[st.band].map((t,i)=>
    `<label class="opt"><input type="radio" name="lvl" value="${i}" ${st.lvl===i?"checked":""}><span class="n">${ROMAN[i]}</span><span>${esc(t)}</span></label>`).join("")}</div>
  <p class="ref" style="margin-top:16px">Resumen orientativo. Texto oficial y traducción al español: Palisano R, Rosenbaum P, Bartlett D, Livingston M. GMFCS – E&amp;R © CanChild 2007, en <a href="https://canchild.ca/en/resources/42-gross-motor-function-classification-system-expanded-revised-gmfcs-e-r" target="_blank" rel="noopener">canchild.ca</a>.</p>`;
  const upd = () => {
    if(st.lvl==null){ bar(null); return; }
    const band = GMFCS_BANDS.find(b=>b[0]===st.band)[1].toLowerCase();
    bar(`<span class="total">Nivel ${ROMAN[st.lvl]}</span><span class="pill">${band}</span><span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ delete ST.gmfcs; viewGmfcs(); };
    $("#cp").onclick=()=>copy(`GMFCS E&R nivel ${ROMAN[st.lvl]} (franja ${band}).`);
  };
  $("#view").onchange = e => {
    if(e.target.name==="band"){ st.band=e.target.value; viewGmfcs(); }
    else if(e.target.name==="lvl"){ st.lvl=Number(e.target.value); upd(); }
  };
  upd();
}

const BEIGHTON_CUT = {pre:["Prepuberal",6], pub:["Puberal hasta 50 años",5], may:["Mayor de 50 años",4]};
function viewBeighton(){
  const st = ST.beighton ||= {v:{}, age:"pre"};
  $("#view").innerHTML = `<h1>Beighton</h1>
  <p class="lede">Puntaje de Beighton para hiperlaxitud articular generalizada. 9 puntos: un punto por lado en las 4 primeras maniobras y uno por la flexión del tronco. Marque solo las maniobras positivas.</p>
  <div class="card" style="margin-bottom:12px"><div class="field"><label>Grupo de edad (punto de corte)</label><div class="seg">
    ${Object.entries(BEIGHTON_CUT).map(([k,[t,c]])=>`<label><input type="radio" name="age" value="${k}" ${st.age===k?"checked":""}><span>${t} (≥${c})</span></label>`).join("")}</div></div></div>
  <div class="stack">${BEIGHTON_ITEMS.map(([name,bil,hint],k)=>`<div class="card"><div class="item-h"><h2>${k+1}. ${esc(name)}</h2><span class="sc" id="sc${k}"></span></div>
    <div class="pic-row">${BEIGHTON_PICS[k]}<div><p class="hint" style="margin-top:0">${esc(hint)}</p>
    <div class="seg">${(bil?[["d","Derecha"],["i","Izquierda"]]:[["u","Positivo"]]).map(([s,t])=>`<label><input type="checkbox" name="b${k}${s}" ${st.v[k+s]?"checked":""}><span>${t}</span></label>`).join("")}</div></div></div></div>`).join("")}</div>
  <p class="ref" style="margin-top:16px">Beighton P, Solomon L, Soskolne CL. Ann Rheum Dis 1973;32:413–8. Puntos de corte por edad de los criterios de SED hiperlaxo 2017 (Malfait F, et al. Am J Med Genet C 2017;175:8–26): ≥6 prepuberal, ≥5 puberal hasta 50 años, ≥4 mayor de 50 años. En niños pequeños la laxitud es fisiológica y el puntaje tiene menor especificidad. Ilustraciones esquemáticas propias.</p>`;
  const upd = () => {
    let tot=0;
    BEIGHTON_ITEMS.forEach(([,bil],k)=>{ const s = bil ? (st.v[k+"d"]?1:0)+(st.v[k+"i"]?1:0) : (st.v[k+"u"]?1:0); $("#sc"+k).textContent = s+"/"+(bil?2:1); tot+=s; });
    const [gt,cut] = BEIGHTON_CUT[st.age], pos = tot>=cut;
    const I = pos ? {cls:"bad", txt:`Hiperlaxitud generalizada (≥${cut})`} : {cls:"ok", txt:`Bajo el corte (≥${cut})`};
    bar(`<span class="total num">${tot}<small> / 9</small></span><span class="pill ${I.cls}">${I.txt}</span>
      <span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ st.v={}; viewBeighton(); };
    $("#cp").onclick=()=>{
      const det = BEIGHTON_ITEMS.map(([n,bil],k)=> bil ? `${n.split(" >")[0].split(" a la")[0]}: D${st.v[k+"d"]?"+":"−"} I${st.v[k+"i"]?"+":"−"}` : `Flexión de tronco: ${st.v[k+"u"]?"+":"−"}`).join("; ");
      copy(`Beighton: ${tot}/9 – ${I.txt.toLowerCase()}, grupo ${gt.toLowerCase()}. ${det}.`);
    };
  };
  $("#view").onchange = e => {
    const n=e.target.name;
    if(n==="age"){ st.age=e.target.value; upd(); return; }
    const m=n.match(/^b(\d)([diu])$/); if(m){ st.v[m[1]+m[2]]=e.target.checked; upd(); }
  };
  upd();
}

// ---------- Edad corregida ----------
const addDays = (isoD, n) => { const d=new Date(isoD+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const wkTxt = d => `${Math.floor(d/7)} sem ${d%7} d`;
const dmy = isoD => isoD.split("-").reverse().join("-");
function calDiff(a, b){ // diferencia calendario entre fechas ISO a <= b
  const A=new Date(a+"T00:00:00Z"), B=new Date(b+"T00:00:00Z");
  let y=B.getUTCFullYear()-A.getUTCFullYear(), m=B.getUTCMonth()-A.getUTCMonth(), d=B.getUTCDate()-A.getUTCDate();
  if(d<0){ m--; d+=new Date(Date.UTC(B.getUTCFullYear(), B.getUTCMonth(), 0)).getUTCDate(); }
  if(m<0){ y--; m+=12; }
  return {y,m,d};
}
const calTxt = ({y,m,d}) => [y?`${y} a`:"", (y||m)?`${m} m`:"", `${d} d`].filter(Boolean).join(" ");
function viewEdad(){
  const st = ST.edad ||= {dob:"", ga:"", gad:"", dom:iso(new Date())};
  $("#view").innerHTML = `<h1>Edad corregida</h1>
  <p class="lede">Calcula edad cronológica, edad postmenstrual, fecha de término y edad corregida a partir de la fecha de nacimiento y la edad gestacional.</p>
  <div class="card"><div class="grid2">
    <div class="field"><label for="edob">Fecha de nacimiento</label><input id="edob" type="date" value="${st.dob}"></div>
    <div class="field"><label for="edom">Fecha de evaluación</label><input id="edom" type="date" value="${st.dom}"></div></div>
    <div class="row" style="margin-top:12px">
      <div class="field"><label for="ega">EG al nacer (sem)</label><input id="ega" type="number" inputmode="numeric" min="22" max="42" value="${st.ga}"></div>
      <div class="field"><label for="egad">+ días</label><input id="egad" type="number" inputmode="numeric" min="0" max="6" value="${st.gad}"></div></div></div>
  <div id="eout" style="margin-top:12px"></div>
  <p class="ref" style="margin-top:16px">Edad corregida = edad cronológica − (40 semanas − EG al nacer). Se usa habitualmente hasta los 2 años de edad cronológica (algunos protocolos la extienden en menores de 28 semanas).</p>`;
  const upd = () => {
    st.dob=$("#edob").value; st.dom=$("#edom").value; st.ga=$("#ega").value; st.gad=$("#egad").value;
    const out=$("#eout");
    if(!st.dob||!st.dom||st.ga===""){ out.innerHTML=""; bar(null); return; }
    const d=daysBetween(st.dob, st.dom); if(d<0){ out.innerHTML=`<div class="card"><span class="pill bad">La fecha de evaluación es anterior al nacimiento</span></div>`; bar(null); return; }
    const g=(+st.ga)*7+(+st.gad||0), pre=280-g, term=addDays(st.dob, pre), pma=g+d, cd=d-pre;
    const corr = cd<0 ? `Faltan ${wkTxt(-cd)} para el término` : calTxt(calDiff(term, st.dom)) + (cd<7*16?` (${wkTxt(cd)})`:"");
    const chrono = calTxt(calDiff(st.dob, st.dom)) + (d<7*16?` (${wkTxt(d)})`:"");
    const late = d > 730.5;
    out.innerHTML = `<div class="card"><dl class="kv" style="font-size:1rem;gap:8px 16px">
      <dt>Edad cronológica</dt><dd>${chrono}</dd>
      <dt>Edad corregida</dt><dd><b>${pre<=0?"No aplica (término)":corr}</b></dd>
      <dt>Edad postmenstrual</dt><dd>${wkTxt(pma)}</dd>
      <dt>Fecha de término (40 sem)</dt><dd>${dmy(term)}</dd>
      <dt>Semanas de prematurez</dt><dd>${pre>0?wkTxt(pre):"0"}</dd></dl>
      ${late&&pre>0?`<p class="hint" style="margin-top:10px">Más de 2 años de edad cronológica: habitualmente ya no se corrige.</p>`:""}</div>`;
    const sum = `Nacido(a) ${dmy(st.dob)} con ${wkTxt(g)} de EG. Al ${dmy(st.dom)}: edad cronológica ${chrono}; edad corregida ${pre<=0?"no aplica":corr}; EPM ${wkTxt(pma)}.`;
    bar(`<span class="pill">${pre>0?"Corregida: "+corr:"Nacido de término"}</span><span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#cp").onclick=()=>copy(sum); $("#clr").onclick=()=>{ delete ST.edad; viewEdad(); };
  };
  $("#view").oninput = $("#view").onchange = upd; upd();
}

  const upd = () => {
    st.ga=$("#apga").value; st.hc=$("#aphc").value;

    $("#clr").onclick=()=>{ delete ST.pcrn; viewPcrn(); };
  };
  $("#view").oninput = $("#view").onchange = upd; upd();
}

const HITOS_EDADES = [...new Set(HITOS.map(h=>h[0]))];
const edadLabel = m => m<24 ? `${m} meses` : m===30 ? "30 meses" : `${m/12} años`;

function viewHitos(){
  const st = ST.hitos ||= {mode:"edad", y:"", mo:"", d:"", dob:"", dom:iso(new Date()), ga:"", gad:"", ok:{}};
  $("#view").innerHTML = `<h1>Hitos del desarrollo</h1>
  <p class="lede">Hitos que al menos el 75% de los niños logra a cada edad (CDC/AAP 2022). Marque los hitos logrados (al marcar uno se marcan los de edades anteriores de la misma área); la app estima la edad de desarrollo por área y el cociente de desarrollo (CD = edad de desarrollo / edad cronológica × 100).</p>
  <div class="card"><div class="field" style="margin-bottom:10px"><label>Edad</label><div class="seg">
      <label><input type="radio" name="hmode" value="fechas" ${st.mode==="fechas"?"checked":""}><span>Por fechas</span></label>
      <label><input type="radio" name="hmode" value="edad" ${st.mode==="edad"?"checked":""}><span>Edad directa</span></label></div></div>
    <div class="grid2" ${st.mode==="fechas"?"":"hidden"}>
      <div class="field"><label for="hdob">Fecha de nacimiento</label><input id="hdob" type="date" value="${st.dob}"></div>
      <div class="field"><label for="hdom">Fecha de evaluación</label><input id="hdom" type="date" value="${st.dom}"></div></div>
    <div class="row" ${st.mode==="edad"?"":"hidden"}>
      <div class="field"><label for="hy">Años</label><input id="hy" type="number" inputmode="numeric" min="0" max="6" value="${st.y}"></div>
      <div class="field"><label for="hm">Meses</label><input id="hm" type="number" inputmode="numeric" min="0" max="72" value="${st.mo}"></div>
      <div class="field"><label for="hd">Días</label><input id="hd" type="number" inputmode="numeric" min="0" max="31" value="${st.d}"></div></div>
    <div class="row" style="margin-top:12px">
      <div class="field"><label for="hga">EG al nacer (sem)</label><input id="hga" type="number" inputmode="numeric" min="22" max="42" placeholder="término" value="${st.ga}"></div>
      <div class="field"><label for="hgad">+ días</label><input id="hgad" type="number" inputmode="numeric" min="0" max="6" value="${st.gad}"></div></div>
    <p class="hint" style="margin:8px 0 0">Si nació antes de las 37 semanas y tiene menos de 24 meses, se usa la edad corregida.</p>
  </div>
  <div id="hout" style="margin-top:12px"></div>
  <p class="ref" style="margin-top:16px">Zubler JM, Wiggins LD, Macias MM, et al. Evidence-informed milestones for developmental surveillance tools. Pediatrics 2022;149(3):e2021052138. Edad de desarrollo por área = mayor edad en la que el niño logra todos los hitos de esa edad y de las anteriores; el global es el promedio de las 4 áreas. Es una estimación para vigilancia, no un test estandarizado: un hito no logrado indica aplicar una prueba de tamizaje (ASQ-3, EEDP, TEPSI).</p>`;
  $("#view").onchange = e => {
    if(e.target.name==="hmode"){ readAge(); st.mode=e.target.value; viewHitos(); return; }
    const m=e.target.name&&e.target.name.match(/^h(\d+)$/); if(m){ st.ok[m[1]]=e.target.checked;
      if(e.target.checked){ const [a0,ar0]=HITOS[m[1]]; // un hito logrado implica los de edades anteriores de la misma área
        HITOS.forEach((h,i)=>{ if(h[1]===ar0 && h[0]<a0){ st.ok[i]=true; const cb=document.querySelector(`[name=h${i}]`); if(cb) cb.checked=true; } }); }
      calc(); return; }
    calc();
  };
  $("#view").oninput = e => { if(e.target.type!=="checkbox") calc(); };
  $("#view").onclick = e => { const a=e.target.dataset.all; if(a!=null){ const on=e.target.dataset.on==="1";
    HITOS.forEach((h,i)=>{ if(h[0]===+a) st.ok[i]=on; }); calc(true); } };
  function readAge(){ st.y=$("#hy").value; st.mo=$("#hm").value; st.d=$("#hd").value; st.dob=$("#hdob").value; st.dom=$("#hdom").value; st.ga=$("#hga").value; st.gad=$("#hgad").value; }
  let shown = null;
  function calc(force){
    readAge();
    let days=null;
    if(st.mode==="fechas"){ if(st.dob&&st.dom) days=daysBetween(st.dob,st.dom); }
    else if(st.y!==""||st.mo!==""||st.d!=="") days=(+st.y||0)*365.25+(+st.mo||0)*DPM+(+st.d||0);
    const out=$("#hout");
    if(days==null||days<0){ out.innerHTML=""; bar(null); shown=null; return; }
    const ga = st.ga===""?null:(+st.ga)*7+(+st.gad||0);
    const corr = ga!=null && ga<259 && days<DPM*24 ? 280-ga : 0;
    const ec = (days-corr)/DPM; // edad cronológica (o corregida) en meses
    if(ec<2){ out.innerHTML=`<div class="card"><span class="pill">${corr?"Edad corregida":"Edad"} menor de 2 meses: la primera lista de hitos es a los 2 meses.</span></div>`; bar(null); shown=null; return; }
    const cur = HITOS_EDADES.filter(a=>a<=ec).pop();
    const next = HITOS_EDADES.find(a=>a>cur);
    const ages = HITOS_EDADES.filter(a=>a<=cur).concat(next?[next]:[]);
    const key = ages.join(",");
    if(force || key!==shown){
      shown = key;
      out.innerHTML = `<div id="hres"></div>` + ages.slice().reverse().map(a=>{
        const tag = a===cur ? "Edad actual" : a===next ? "Siguiente (opcional)" : "Anterior";
        return `<details class="cat" ${a===cur?"open":""} style="margin-top:12px"><summary>${edadLabel(a)}<span class="c" id="hc${a}"></span></summary>
          <div style="padding:0 16px 14px"><p class="hint" style="margin:0 0 8px">${tag}. <button data-all="${a}" data-on="1">Marcar todos</button> <button data-all="${a}" data-on="0">Desmarcar</button></p>
          ${Object.keys(HITOS_AREAS).map(ar=>{ const hs=HITOS.map((h,i)=>[h,i]).filter(([h])=>h[0]===a&&h[1]===ar); if(!hs.length) return "";
            return `<div class="side-l" style="margin-top:10px">${HITOS_AREAS[ar]}</div>`+hs.map(([h,i])=>`<label class="opt" style="grid-template-columns:1.6em 1fr"><input type="checkbox" name="h${i}" ${st.ok[i]?"checked":""}><span class="n">✓</span><span>${esc(h[2])}</span></label>`).join(""); }).join("")}
          </div></details>`; }).join("");
    }
    // edad de desarrollo por área: mayor edad con todos los hitos de esa edad y anteriores logrados
    const ed = {}; const faltan = [];
    for(const ar of Object.keys(HITOS_AREAS)){
      let v=0;
      for(const a of ages){ const hs=HITOS.map((h,i)=>[h,i]).filter(([h])=>h[0]===a&&h[1]===ar); if(!hs.length) continue;
        if(hs.every(([h,i])=>st.ok[i])) v=a; else break; }
      ed[ar]=v;
    }
    HITOS.forEach((h,i)=>{ if(h[0]<=cur && !st.ok[i]) faltan.push(i); });
    ages.forEach(a=>{ const hs=HITOS.map((h,i)=>i).filter(i=>HITOS[i][0]===a); const n=hs.filter(i=>st.ok[i]).length; const el=$("#hc"+a); if(el) el.textContent=`${n}/${hs.length}`; });
    const cd = v => Math.round(v/ec*100);
    const glob = Object.values(ed).reduce((x,y)=>x+y,0)/4;
    const cls = v => v>=70?"ok":"bad";
    const ecTxt = `${fmt(ec,1)} meses`;
    $("#hres").innerHTML = `<div class="card"><p style="margin:0 0 10px">Edad ${corr?"corregida":"cronológica"}: <b>${ecTxt}</b> · lista vigente: ${edadLabel(cur)}</p>
      <div class="chart"><table class="t"><tr><th>Área</th><th>Edad de desarrollo</th><th>CD</th></tr>
      ${Object.entries(HITOS_AREAS).map(([k,n])=>`<tr><td style="font-family:var(--body);color:var(--ink)">${n}</td><td>${ed[k]?edadLabel(ed[k]):"< 2 meses"}</td><td><span class="pill ${cls(cd(ed[k]))}">${cd(ed[k])}</span></td></tr>`).join("")}
      <tr><td style="font-family:var(--body);color:var(--ink)"><b>Global (promedio)</b></td><td>${fmt(glob,1)} meses</td><td><span class="pill ${cls(cd(glob))}">${cd(glob)}</span></td></tr></table></div>
      ${faltan.length?`<p class="hint" style="margin-top:10px"><b>${faltan.length} hito${faltan.length>1?"s":""} no marcado${faltan.length>1?"s":""} hasta los ${edadLabel(cur)}.</b> Un hito no logrado a la edad indicada justifica aplicar una prueba de tamizaje.</p>`:`<p class="hint" style="margin-top:10px">Logra todos los hitos esperados para su edad.</p>`}
      <p class="hint">CD &lt;70 se considera alterado. Como las listas van cada 2–12 meses, el CD tiene saltos y no se usan cortes intermedios.</p></div>`;
    const sum = `Hitos del desarrollo (CDC/AAP 2022). Edad ${corr?"corregida":"cronológica"} ${ecTxt}. `
      + Object.entries(HITOS_AREAS).map(([k,n])=>`${n}: ED ${ed[k]?edadLabel(ed[k]):"<2 meses"}, CD ${cd(ed[k])}${cd(ed[k])<70?" (alterado)":""}`).join("; ")
      + `. Global: ED ${fmt(glob,1)} meses, CD ${cd(glob)}${cd(glob)<70?" (alterado)":""}.`
      + (faltan.length?` Hitos no logrados: ${faltan.map(i=>`${HITOS[i][2]} (${edadLabel(HITOS[i][0])})`).join("; ")}.`:" Logra todos los hitos para su edad.");
    bar(`<span class="pill ${cls(cd(glob))}">CD global ${cd(glob)}</span><span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#cp").onclick=()=>copy(sum); $("#clr").onclick=()=>{ delete ST.hitos; viewHitos(); };
  }
  calc();
}

// ---------- Tardieu modificada ----------
const TARDIEU_MUSCLES = ["Gastrocnemio (rodilla extendida)","Sóleo (rodilla flexionada)","Isquiotibiales","Aductores de cadera","Recto femoral","Flexores de codo","Pronadores","Flexores de muñeca","Flexores de dedos"];
const TARDIEU_X = ["Sin resistencia en todo el rango","Resistencia leve en todo el rango, sin enganche claro","Enganche claro en un ángulo preciso que interrumpe el movimiento, seguido de liberación","Clono agotable (<10 s) en un ángulo preciso","Clono inagotable (>10 s) en un ángulo preciso","Articulación inmóvil"];
function viewTardieu(){
  const st = ST.tardieu ||= {rows:[{m:0,side:"d",r1:"",r2:"",x:null},{m:0,side:"i",r1:"",r2:"",x:null}]};
  const rowHtml = (r,k) => `<div class="card" data-k="${k}">
    <div class="item-h"><div class="field" style="flex:1"><label for="tm${k}">Músculo</label><select id="tm${k}" name="m">${TARDIEU_MUSCLES.map((m,i)=>`<option value="${i}" ${r.m===i?"selected":""}>${m}</option>`).join("")}</select></div></div>
    <div class="row" style="margin-top:10px;align-items:end">
      <div class="field"><label>Lado</label><div class="seg"><label><input type="radio" name="side${k}" value="d" ${r.side==="d"?"checked":""}><span>Der</span></label><label><input type="radio" name="side${k}" value="i" ${r.side==="i"?"checked":""}><span>Izq</span></label></div></div>
      <div class="field"><label for="r1${k}">R1 (V3) °</label><input id="r1${k}" name="r1" type="number" inputmode="numeric" value="${r.r1}"></div>
      <div class="field"><label for="r2${k}">R2 (V1) °</label><input id="r2${k}" name="r2" type="number" inputmode="numeric" value="${r.r2}"></div>
      <div class="field"><label>R2 − R1</label><div class="big num" style="font-size:1.3rem" id="dif${k}">–</div></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Calidad de la reacción (X)</label><div class="seg">${[0,1,2,3,4,5].map(x=>`<label><input type="radio" name="x${k}" value="${x}" ${r.x===x?"checked":""}><span>${x}</span></label>`).join("")}</div></div>
    ${st.rows.length>1?`<div style="margin-top:10px"><button data-del="${k}">Quitar</button></div>`:""}
  </div>`;
  $("#view").innerHTML = `<h1>Tardieu modificada</h1>
  <p class="lede">Para cada músculo: R2 es el ángulo de rango pasivo a velocidad lenta (V1) y R1 el ángulo del enganche a velocidad rápida (V3). Una diferencia R2 − R1 amplia sugiere componente dinámico (espasticidad); una diferencia pequeña sugiere contractura fija.</p>
  <div class="stack" id="rows">${st.rows.map(rowHtml).join("")}</div>
  <div style="margin-top:12px"><button id="add">Agregar músculo</button></div>
  <div class="card" style="margin-top:16px"><h2>Calidad de la reacción muscular (X)</h2><table class="t" style="margin-top:8px">${TARDIEU_X.map((t,i)=>`<tr><td>${i}</td><td>${t}</td></tr>`).join("")}</table>
  <p class="hint" style="margin-top:8px">V1: lo más lento posible. V2: velocidad de caída por gravedad. V3: lo más rápido posible. Ángulos medidos desde la posición de mínimo estiramiento.</p></div>
  <p class="ref" style="margin-top:16px">Tardieu G, et al. 1954; Boyd RN, Graham HK. Eur J Neurol 1999;6(Suppl 4):S23–35.</p>`;
  const num = v => v===""||v==null ? null : Number(v);
  const upd = () => {
    const lines=[];
    st.rows.forEach((r,k)=>{ const a=num(r.r1), b=num(r.r2); const d = a!=null&&b!=null ? b-a : null;
      $("#dif"+k).textContent = d==null ? "–" : `${d}°`;
      if(a!=null||b!=null||r.x!=null) lines.push(`${TARDIEU_MUSCLES[r.m]} ${r.side==="d"?"D":"I"}: R1 ${a??"–"}°, R2 ${b??"–"}°, R2−R1 ${d??"–"}°, X${r.x??"–"}`); });
    if(!lines.length){ bar(null); return; }
    bar(`<span class="pill">${lines.length} músculo${lines.length>1?"s":""} evaluado${lines.length>1?"s":""}</span><span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ delete ST.tardieu; viewTardieu(); };
    $("#cp").onclick=()=>copy(`Tardieu modificada: ${lines.join("; ")}.`);
  };
  $("#view").oninput = $("#view").onchange = e => {
    const c=e.target.closest("[data-k]"); if(!c) return; const r=st.rows[+c.dataset.k], n=e.target.name;
    if(n==="m") r.m=+e.target.value; else if(n==="r1"||n==="r2") r[n]=e.target.value;
    else if(n.startsWith("side")) r.side=e.target.value; else if(n.startsWith("x")) r.x=+e.target.value;
    upd();
  };
  $("#add").onclick=()=>{ const last=st.rows[st.rows.length-1]; st.rows.push({m:last?last.m:0, side:last&&last.side==="d"?"i":"d", r1:"",r2:"",x:null}); viewTardieu(); };
  $("#rows").onclick=e=>{ const d=e.target.dataset.del; if(d!=null){ st.rows.splice(+d,1); viewTardieu(); } };
  upd();
}

const BFM_PROV = ["Sin distonía","Solo con una acción específica","Con muchas acciones","Con la acción de una parte distante del cuerpo, o intermitente en reposo","Presente en reposo"];
const BFM_PROV_SPEECH = ["Ninguno","Ocasional en habla o deglución, o en ambas","Frecuente en una de ellas","Frecuente en una y ocasional en la otra","Frecuente en ambas"];
const BFM_REG = [
  ["Ojos",0.5,["Sin distonía","Leve: parpadeo ocasional","Parpadeo frecuente sin espasmos prolongados","Espasmos prolongados de cierre palpebral, ojos abiertos la mayor parte del tiempo","Espasmos prolongados, ojos cerrados al menos 30% del tiempo"]],
  ["Boca",0.5,["Sin distonía","Leve: muecas ocasionales u otros movimientos","Muecas u otros movimientos menos del 50% del tiempo","Espasmos o contracciones distónicas moderadas la mayor parte del tiempo","Contracciones severas la mayor parte del tiempo"]],

  ["Cuello",0.5,["Sin distonía","Leve: tracción ocasional","Tortícolis evidente pero leve","Tracción moderada","Tracción extrema"]],

  ["Brazo izquierdo",1,null],
  ["Tronco",1,["Sin distonía","Leve inclinación, sin importancia clínica","Inclinación evidente que no interfiere con estar de pie o caminar","Moderada: interfiere con estar de pie o caminar","Extrema: impide estar de pie o caminar"]],
  ["Pierna derecha",1,["Sin distonía","Leve, sin alteración funcional","Leve: camina con agilidad y sin ayuda","Moderada: dificulta mucho la marcha o requiere ayuda","Severa: no puede pararse ni caminar sobre esa pierna"]],
  ["Pierna izquierda",1,null]
];
BFM_REG[5][2]=BFM_REG[4][2]; BFM_REG[8][2]=BFM_REG[7][2];
const BFM_DIS = [["Habla",4],["Escritura",4],["Alimentación (uso de cubiertos)",4],["Comer y deglutir",4],["Higiene",4],["Vestirse",4],["Marcha",6]];
function viewBfm(){
  const st = ST.bfm ||= {p:{}, s:{}, d:{}};
  const seg = (nm,val,max) => `<div class="seg">${Array.from({length:max+1},(_,i)=>`<label><input type="radio" name="${nm}" value="${i}" ${val===i?"checked":""}><span>${i}</span></label>`).join("")}</div>`;
  $("#view").innerHTML = `<h1>Burke-Fahn-Marsden</h1>
  <p class="lede">Escala de distonía (BFMDRS). Movimiento: en cada región, factor provocador × severidad × peso; total 0–120. Discapacidad: 0–30.</p>
  <div class="stack">${BFM_REG.map(([n,w,sev,speech],k)=>`<div class="card"><div class="item-h"><h2>${n} <small style="color:var(--muted);font-weight:400">× ${fmtN(w)}</small></h2><span class="sc" id="bs${k}"></span></div>
    <div class="sides" style="margin-top:8px"><div><div class="side-l">Factor provocador</div>${seg("p"+k,st.p[k],4)}</div><div><div class="side-l">Severidad</div>${seg("s"+k,st.s[k],4)}</div></div>
    <details style="margin-top:8px"><summary class="hint" style="cursor:pointer">Ver descriptores</summary><div class="sides" style="margin-top:6px">
      <table class="t">${(speech?BFM_PROV_SPEECH:BFM_PROV).map((t,i)=>`<tr><td>${i}</td><td>${t}</td></tr>`).join("")}</table>
      <table class="t">${sev.map((t,i)=>`<tr><td>${i}</td><td>${t}</td></tr>`).join("")}</table></div></details></div>`).join("")}
  <div class="card"><h2>Escala de discapacidad</h2><p class="hint">0 normal a 4 dependencia total (marcha: 0 normal a 6 no camina).</p>
    <div class="stack">${BFM_DIS.map(([n,mx],k)=>`<div><div class="side-l">${n}</div>${seg("d"+k,st.d[k],mx)}</div>`).join("")}</div></div></div>
  <p class="ref" style="margin-top:16px">Burke RE, Fahn S, Marsden CD, et al. Neurology 1985;35:73–7. Descriptores resumidos.</p>`;
  const upd = () => {
    let mov=0, n=0; const parts=[];
    BFM_REG.forEach(([nm,w],k)=>{ const p=st.p[k], s=st.s[k]; const v = p!=null&&s!=null ? p*s*w : null;
      $("#bs"+k).textContent = v==null?"":fmtN(v); if(v!=null){ mov+=v; n++; if(v>0) parts.push(`${nm} ${p}×${s}${w!==1?"×0,5":""}=${fmtN(v)}`); } });
    const dn = Object.keys(st.d).length, dis = Object.values(st.d).reduce((a,b)=>a+b,0);
    bar(`<span class="total num">${fmtN(mov)}<small> / 120</small></span>${n<9?`<span class="pill">${n} de 9 regiones</span>`:""}
      ${dn?`<span class="pill">Discapacidad ${dis}/30</span>`:""}<span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
    $("#clr").onclick=()=>{ delete ST.bfm; viewBfm(); };
    $("#cp").onclick=()=>copy(`BFMDRS movimiento: ${fmtN(mov)}/120${n<9?" (incompleto)":""}${parts.length?` (${parts.join("; ")})`:""}.${dn?` Discapacidad: ${dis}/30${dn<7?" (incompleto)":""}.`:""}`);
  };
  $("#view").onchange = e => { const m=e.target.name.match(/^([psd])(\d+)$/); if(m){ st[m[1]][m[2]]=+e.target.value; upd(); } };
  upd();
}

  const t = WFL[(standing?"pe":"pl")+sex]; if(cm<t[0][0] || cm>t[t.length-1][0]) return null;

    const get = m => antLMS(ref, k, sex, Math.min(Math.max(m,t[0][0]),t[t.length-1][0]));
    const stepM = yrs ? 2 : 0.5, pts=[]; for(let m=minM;m<=maxM+1e-9;m+=stepM) pts.push(Math.min(m,maxM));

    const v = lastV[k]; if(mo!=null && v!=null && mo>=minM && mo<=maxM){ ymin=Math.min(ymin,v); ymax=Math.max(ymax,v); }
    const span = ymax-ymin, gs = span>120?20:span>60?10:span>24?5:span>10?2:1;
    ymin = Math.floor(ymin/gs)*gs; ymax = Math.ceil(ymax/gs)*gs;
    const X = m => pl+(W-pl-pr)*(m-minM)/(maxM-minM), Y = val => pt+(H-pt-pb)*(1-(val-ymin)/(ymax-ymin));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva ${ANT_K[k][0]} ${ref==="who"?"OMS":"CDC"}">`;
    for(let y=ymin; y<=ymax+1e-9; y+=gs) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(y)+4}" text-anchor="end">${y}</text>`;
    const step = yrs ? 24 : (maxM-minM)>36 ? 6 : 3;
    for(let m=Math.ceil(minM/step)*step; m<=maxM; m+=step) s+=`<line x1="${X(m)}" x2="${X(m)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-width="1" opacity=".6"/><text x="${X(m)}" y="${H-pb+16}" text-anchor="middle">${yrs?m/12:m}</text>`;
    s+=`<text x="${W-pr}" y="${H-4}" text-anchor="end">${yrs?"años":"meses"}</text><text x="4" y="14">${ANT_K[k][1]}</text>`;
    const labs = lines.map(([z,lab])=>({lab, y:Y(xOf(z,get(maxM)))+4})).sort((a,b)=>b.y-a.y);
    for(let i=1;i<labs.length;i++) if(labs[i-1].y-labs[i].y<12) labs[i].y=labs[i-1].y-12;
    for(const [z,lab] of lines){
      const d = pts.map((m,i)=>`${i?"L":"M"}${X(m).toFixed(1)},${Y(xOf(z,get(m))).toFixed(1)}`).join("");

    }
    for(const l of labs) s+=`<text x="${W-pr+4}" y="${l.y}">${l.lab}</text>`;
    if(mo!=null && v!=null && mo>=minM && mo<=maxM) s+=`<circle cx="${X(mo)}" cy="${Y(v)}" r="5.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;

const NELL = {"m":[[0,34.96,1.3],[1,36.97,1.28],[2,39.18,1.26],[3,40.52,1.23],[4,41.88,1.25],[5,42.81,1.28],[6,43.77,1.32],[7,44.43,1.32],[8,45.08,1.31],[9,45.54,1.3],[10,46.04,1.28],[11,46.43,1.27],[12,46.82,1.27],[13,47.09,1.29],[14,47.37,1.29],[15,47.58,1.29],[16,47.74,1.3],[17,47.9,1.31],[18,48.03,1.32],[19,48.23,1.33],[20,48.42,1.35],[21,48.62,1.36],[22,48.82,1.37],[23,49.01,1.39],[24,49.21,1.36],[30,49.69,1.34],[36,49.97,1.31],[42,50.35,1.34],[48,50.69,1.35],[54,50.88,1.35],[60,51.15,1.35],[72,51.57,1.37],[84,51.96,1.4],[96,52.26,1.43],[108,52.71,1.45],[120,53.08,1.48],[132,53.44,1.53],[144,53.84,1.57],[156,54.22,1.54],[168,54.6,1.48],[180,55.0,1.35],[192,55.39,1.28],[204,55.66,1.26],[216,55.71,1.33]],"f":[[0,34.14,1.27],[1,35.93,1.27],[2,38.13,1.25],[3,39.5,1.27],[4,40.92,1.29],[5,41.87,1.34],[6,42.78,1.34],[7,43.37,1.36],[8,44.03,1.36],[9,44.48,1.36],[10,44.98,1.35],[11,45.36,1.33],[12,45.76,1.31],[13,46.04,1.3],[14,46.37,1.29],[15,46.58,1.29],[16,46.77,1.29],[17,47.02,1.29],[18,47.17,1.29],[19,47.31,1.3],[20,47.44,1.3],[21,47.58,1.3],[22,47.72,1.31],[23,47.85,1.31],[24,47.99,1.33],[30,48.53,1.35],[36,48.91,1.36],[42,49.49,1.35],[48,49.85,1.34],[54,50.25,1.32],[60,50.49,1.3],[72,50.69,1.31],[84,51.17,1.33],[96,51.51,1.36],[108,51.84,1.38],[120,52.07,1.42],[132,52.49,1.46],[144,52.97,1.46],[156,53.5,1.43],[168,54.0,1.37],[180,54.38,1.3],[192,54.65,1.27],[204,54.89,1.3],[216,55.04,1.37]]};
function nellLMS(sex, months){
  const t = NELL[sex]; if(months<0 || months>216) return null;
  let k=0; while(k<t.length-2 && t[k+1][0]<months) k++;
  const a=t[k], b=t[k+1], f=(months-a[0])/(b[0]-a[0]);
  const M=a[1]+(b[1]-a[1])*f, sd=a[2]+(b[2]-a[2])*f;
  return {L:1, M, S:sd/M};
}
// UK90 (Cole 1998, reanálisis 2009): [mes, M, S], L=1; 4–18 años (niñas hasta 17)
function ukLMS(sex, months){
  const t = UK90["uk_"+sex]; if(months<t[0][0] || months>t[t.length-1][0]) return null;
  let k=0; while(k<t.length-2 && t[k+1][0]<months) k++;
  const a=t[k], b=t[k+1], f=(months-a[0])/(b[0]-a[0]);
  return {L:1, M:a[1]+(b[1]-a[1])*f, S:a[2]+(b[2]-a[2])*f};
}
function cdcLMS(sex, months){
  const t = HC["cdc_"+sex]; if(months<0 || months>36) return null;
  let k=0; while(k<t.length-2 && t[k+1][0]<months) k++;
  const a=t[k], b=t[k+1], f=(months-a[0])/(b[0]-a[0]);
  return {L:a[1]+(b[1]-a[1])*f, M:a[2]+(b[2]-a[2])*f, S:a[3]+(b[3]-a[3])*f};
}
const zOf = (x,{L,M,S}) => Math.abs(L)<1e-9 ? Math.log(x/M)/S : (Math.pow(x/M,L)-1)/(L*S);
const xOf = (z,{L,M,S}) => Math.abs(L)<1e-9 ? M*Math.exp(S*z) : M*Math.pow(1+L*S*z,1/L);
function ncdf(z){ // Abramowitz-Stegun 7.1.26
  const t=1/(1+0.3275911*Math.abs(z)/Math.SQRT2);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z/2);
  return z>=0 ? (1+y)/2 : (1-y)/2;
}
const pctTxt = p => p<0.001 ? "<0,1" : p>0.999 ? ">99,9" : fmt(p*100, p<0.01||p>0.99 ? 1 : 0);
function hcInterp(z){
  if(z<-3) return {cls:"bad", txt:"Microcefalia severa (< −3 DE)"};
  if(z<-2) return {cls:"bad", txt:"Microcefalia (< −2 DE)"};
  if(z>3) return {cls:"bad", txt:"Macrocefalia (> +3 DE)"};
  if(z>2) return {cls:"bad", txt:"Macrocefalia (> +2 DE)"};
  if(Math.abs(z)>1.88) return {cls:"warn", txt: z<0 ? "Bajo P3" : "Sobre P97"};
  return {cls:"ok", txt:"Rango normal"};
}
const iso = d => d.toISOString().slice(0,10);
function daysBetween(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/864e5); }
function ageTxt(days){
  if(days<DPM*24){ const m=Math.floor(days/DPM), d=Math.round(days-m*DPM); return `${m} m ${d} d`; }
  const y=Math.floor(days/365.25), m=Math.floor((days-y*365.25)/DPM); return `${y} a ${m} m`;
}

function viewPC(){
  const st = ST.pc ||= {sex:"m", mode:"fechas", dob:"", dom:iso(new Date()), y:"", mo:"", d:"", ga:"", gad:"", corr:true, hc:"", ref:"who"};
  $("#view").innerHTML = `<h1>Perímetro craneano</h1>
  <p class="lede">Puntaje z y percentil con tablas LMS: OMS 2006 (0–5 años, por día), CDC 2000 (0–36 meses), Nellhaus (0–18 años; referencia principal desde los 5 años) y UK90 (4–18 años). Para la medición al nacer en pretérminos use <a href="#pcrn">PC al nacer (Alarcón-Pittaluga)</a>.</p>
  <div class="stack">
  <div class="card"><div class="grid2">
    <div class="field"><label>Sexo</label><div class="seg">
      <label><input type="radio" name="sex" value="m" ${st.sex==="m"?"checked":""}><span>Masculino</span></label>
      <label><input type="radio" name="sex" value="f" ${st.sex==="f"?"checked":""}><span>Femenino</span></label></div></div>
    <div class="field"><label for="hc">Perímetro craneano (cm)</label><input id="hc" type="number" inputmode="decimal" step="0.1" min="20" max="65" placeholder="ej. 44,5" value="${st.hc}"></div>
  </div></div>
  <div class="card"><div class="field" style="margin-bottom:10px"><label>Edad</label><div class="seg">
      <label><input type="radio" name="mode" value="fechas" ${st.mode==="fechas"?"checked":""}><span>Por fechas</span></label>
      <label><input type="radio" name="mode" value="edad" ${st.mode==="edad"?"checked":""}><span>Edad directa</span></label></div></div>
    <div class="grid2" ${st.mode==="fechas"?"":"hidden"} id="byDates">
      <div class="field"><label for="dob">Fecha de nacimiento</label><input id="dob" type="date" value="${st.dob}"></div>
      <div class="field"><label for="dom">Fecha de medición</label><input id="dom" type="date" value="${st.dom}"></div></div>
    <div class="row" ${st.mode==="edad"?"":"hidden"} id="byAge">
      <div class="field"><label for="ay">Años</label><input id="ay" type="number" inputmode="numeric" min="0" max="18" value="${st.y}"></div>
      <div class="field"><label for="am">Meses</label><input id="am" type="number" inputmode="numeric" min="0" max="60" value="${st.mo}"></div>
      <div class="field"><label for="ad">Días</label><input id="ad" type="number" inputmode="numeric" min="0" max="31" value="${st.d}"></div></div>
    <div class="row" style="margin-top:12px;align-items:end">
      <div class="field"><label for="ga">EG al nacer (sem)</label><input id="ga" type="number" inputmode="numeric" min="22" max="42" placeholder="término" value="${st.ga}"></div>
      <div class="field"><label for="gad">+ días</label><input id="gad" type="number" inputmode="numeric" min="0" max="6" value="${st.gad}"></div>
      <label class="field" style="flex:2 1 200px;flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink)">
        <input type="checkbox" id="corr" style="width:auto" ${st.corr?"checked":""}> Usar edad corregida si &lt;37 sem (hasta 24 meses)</label>
    </div>
  </div>
  <div id="out"></div>
  <div class="card"><div class="item-h"><h2>Curva</h2><div class="seg">
      <label><input type="radio" name="ref" value="who" ${st.ref==="who"?"checked":""}><span>OMS</span></label>
      <label><input type="radio" name="ref" value="cdc" ${st.ref==="cdc"?"checked":""}><span>CDC</span></label>
      <label><input type="radio" name="ref" value="nell" ${st.ref==="nell"?"checked":""}><span>Nellhaus</span></label>
      <label><input type="radio" name="ref" value="uk" ${st.ref==="uk"?"checked":""}><span>UK90</span></label></div></div>
    <div class="chart" id="chart" style="margin-top:8px"></div></div>
  </div>
  <p class="ref" style="margin-top:16px">OMS: WHO Child Growth Standards 2006 (head circumference-for-age). CDC: CDC 2000 Growth Charts (hcageinf). Nellhaus: Nellhaus G. Head circumference from birth to eighteen years. Pediatrics 1968;41:106–14 (media ±2 DE por sexo; valores digitalizados de la curva publicada, el artículo no trae tabla numérica: aproximación de ±0,3 cm). UK90: UK 1990 reference (Cole TJ, Freeman JV, Preece MA. Stat Med 1998;17:407–29), reanálisis 2009. Datos LMS tomados del paquete rcpchgrowth (RCPCH), que reproduce las tablas oficiales. La OMS se recomienda para 0–2 años; CDC hasta 36 meses; UK90 es la referencia británica que se usa desde los 4 años (población del Reino Unido).</p>`;

  const read = () => {
    st.hc=$("#hc").value; st.dob=$("#dob").value; st.dom=$("#dom").value; st.y=$("#ay").value; st.mo=$("#am").value; st.d=$("#ad").value;
    st.ga=$("#ga").value; st.gad=$("#gad").value; st.corr=$("#corr").checked;
  };
  const calc = () => {
    read();
    let days=null;
    if(st.mode==="fechas"){ if(st.dob && st.dom) days=daysBetween(st.dob, st.dom); }
    else if(st.y!==""||st.mo!==""||st.d!=="") days=(+st.y||0)*365.25+(+st.mo||0)*DPM+(+st.d||0);
    let corrDays=0, corrected=false;
    const ga = st.ga===""?null:(+st.ga)*7+(+st.gad||0);
    if(days!=null && ga!=null && ga<37*7 && st.corr && days<DPM*24){ corrDays=280-ga; corrected=true; }
    const hc = st.hc===""?null:Number(String(st.hc).replace(",","."));
    const out=$("#out");
    if(days==null || days<0){ out.innerHTML = days<0?`<div class="card"><span class="pill bad">La fecha de medición es anterior al nacimiento</span></div>`:""; bar(null); drawChart(null,null); return; }
    const ad = days - corrDays;
    const ageLine = corrected ? `Edad cronológica ${ageTxt(days)} · <b>corregida ${ad<0?"−"+ageTxt(-ad):ageTxt(ad)}</b>` : `Edad ${ageTxt(days)}`;
    if(ad<0){ out.innerHTML=`<div class="card">${ageLine}<p class="hint">Con edad corregida negativa (antes del término) use curvas de prematuros (Fenton / INTERGROWTH-21st).</p></div>`; bar(null); drawChart(null,null); return; }
    const res = [];
    const w = whoLMS(st.sex, ad), c = cdcLMS(st.sex, ad/DPM), u = ukLMS(st.sex, ad/DPM), nl = nellLMS(st.sex, ad/DPM);
    const refs = ad/DPM>=60 ? [["Nellhaus",nl],["UK90",u],["OMS",w],["CDC",c]] : [["OMS",w],["CDC",c],["Nellhaus",nl],["UK90",u]];
    for(const [nm,lms] of refs){
      if(!lms){ res.push({nm, na:true}); continue; }
      const z = hc==null?null:zOf(hc,lms);
      res.push({nm, lms, z, p:z==null?null:ncdf(z)});
    }
    out.innerHTML = `<div class="card"><p style="margin:0 0 10px">${ageLine}</p><div class="grid2">${res.filter(r=>!r.na || res.every(x=>x.na)).map(r=>`<div>
      <div class="side-l">${r.nm}</div>
      ${r.na?`<p class="hint">Fuera de rango (${r.nm==="OMS"?"0–5 años":r.nm==="CDC"?"0–36 meses":r.nm==="Nellhaus"?"0–18 años":st.sex==="m"?"4–18 años":"4–17 años"})</p>`:
      r.z==null?`<dl class="kv"><dt>P50</dt><dd>${fmt(r.lms.M,1)} cm</dd><dt>−2 DE</dt><dd>${fmt(xOf(-2,r.lms),1)} cm</dd><dt>+2 DE</dt><dd>${fmt(xOf(2,r.lms),1)} cm</dd></dl>`:
      `<div class="big num">z ${r.z<0?"−":"+"}${fmt(Math.abs(r.z),2)}</div><div class="num" style="margin:2px 0 8px">Percentil ${pctTxt(r.p)}</div>
       <span class="pill ${hcInterp(r.z).cls}">${hcInterp(r.z).txt}</span>
       <dl class="kv" style="margin-top:10px"><dt>P50</dt><dd>${fmt(r.lms.M,1)} cm</dd><dt>−2 / +2 DE</dt><dd>${fmt(xOf(-2,r.lms),1)} / ${fmt(xOf(2,r.lms),1)} cm</dd></dl>`}
    </div>`).join("")}</div></div>`;
    const am = ad/DPM, okRef = {who:!!w, cdc:!!c, uk:!!u, nell:!!nl};
    if(!okRef[st.ref]){ st.ref = nl ? "nell" : u ? "uk" : w ? "who" : "cdc"; const rb=document.querySelector(`[name=ref][value=${st.ref}]`); if(rb) rb.checked=true; }
    drawChart(ad, hc);
    if(hc!=null){
      const sum = `PC ${fmt(hc,1)} cm, ${st.sex==="m"?"masculino":"femenino"}, ${corrected?`edad corregida ${ageTxt(ad)} (cronológica ${ageTxt(days)})`:`edad ${ageTxt(days)}`}. `
        + res.filter(r=>!r.na).map(r=>`${r.nm}: z ${r.z<0?"−":"+"}${fmt(Math.abs(r.z),2)}, P${pctTxt(r.p)} (${hcInterp(r.z).txt.toLowerCase()})`).join("; ") + ".";
      bar(`<span class="pill">${res.filter(r=>!r.na).map(r=>`${r.nm} z ${r.z<0?"−":"+"}${fmt(Math.abs(r.z),2)}`).join(" · ")}</span><span class="spacer"></span><button id="clr">Limpiar</button><button class="pri" id="cp">Copiar resumen</button>`);
      $("#cp").onclick=()=>copy(sum); $("#clr").onclick=()=>{ delete ST.pc; viewPC(); };
    } else bar(null);
  };
  function drawChart(ad, hc){
    const sex=st.sex, ref=st.ref;
    const minM = ref==="uk" ? 48 : 0, maxM = ref==="who" ? 60 : ref==="cdc" ? 36 : ref==="nell" ? 216 : (sex==="m"?216:204), yrs = ref==="uk"||ref==="nell";
    const W=480,H=370,pl=34,pr=34,pt=24,pb=30;
    const lines = ref==="nell" ? [[-2,"−2"],[0,"0"],[2,"+2"]] : ref==="cdc" ? [[-1.8808,"P3"],[-1.2816,"P10"],[0,"P50"],[1.2816,"P90"],[1.8808,"P97"]] : [[-3,"−3"],[-2,"−2"],[0,"0"],[2,"+2"],[3,"+3"]];
    const get = m => ref==="who" ? whoLMS(sex, Math.min(m*DPM, 1856)) : ref==="cdc" ? cdcLMS(sex, m) : ref==="nell" ? nellLMS(sex, m) : ukLMS(sex, m);
    const pts = []; for(let m=minM;m<=maxM+1e-9;m+=(yrs?1:0.25)) pts.push(m);
    const ymin = Math.floor(xOf(ref==="nell"?-2.6:-3.2,get(minM))) , ymax = Math.ceil(xOf(3.2,get(maxM)));
    const X = m => pl+(W-pl-pr)*(m-minM)/(maxM-minM), Y = v => pt+(H-pt-pb)*(1-(v-ymin)/(ymax-ymin));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de perímetro craneano ${ref==="who"?"OMS":ref==="cdc"?"CDC":ref==="nell"?"Nellhaus":"UK90"}">`;
    for(let v=Math.ceil(ymin/2)*2; v<=ymax; v+=2) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
    const step = ref==="who"?6:ref==="cdc"?3:24;
    for(let m=minM;m<=maxM;m+=step) s+=`<line x1="${X(m)}" x2="${X(m)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-width="1" opacity=".6"/><text x="${X(m)}" y="${H-pb+16}" text-anchor="middle">${yrs?m/12:m}</text>`;
    s+=`<text x="${W-pr}" y="${H-4}" text-anchor="end">${yrs?"años":"meses"}</text><text x="4" y="14">cm</text>`;
    for(const [z,lab] of lines){
      const d = pts.map((m,i)=>`${i?"L":"M"}${X(m).toFixed(1)},${Y(xOf(z,get(m))).toFixed(1)}`).join("");
      const strong = z===0, ext = Math.abs(z)>=1.88;
      s+=`<path d="${d}" fill="none" stroke="${strong?"var(--accent)":ext?"var(--bad)":"var(--muted)"}" stroke-width="${strong?2:1.4}" ${Math.abs(z)>2.5?'stroke-dasharray="4 3"':""}/>`;
      s+=`<text x="${W-pr+4}" y="${Y(xOf(z,get(maxM)))+4}">${lab}</text>`;
    }
    const am = ad==null?null:ad/DPM;
    if(am!=null && hc!=null && am>=minM && am<=maxM) s+=`<circle cx="${X(am)}" cy="${Y(hc)}" r="5.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
    $("#chart").innerHTML = s+"</svg>";
  }
  $("#view").oninput = calc;
  $("#view").onchange = e => {
    const n=e.target.name;
    if(n==="sex"||n==="ref"){ st[n]=e.target.value; calc(); }
    else if(n==="mode"){ read(); st.mode=e.target.value; viewPC(); }
    else calc();
  };
  calc();
}

route();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
